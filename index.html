<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<title>微信AI内容归档与管理系统</title>
<style>
:root{--bg:#f4f6f9;--card:#fff;--bd:#e5e7eb;--txt:#111827;--mut:#6b7280;--pri:#2563eb;--ok:#059669;--dn:#dc2626;--r:12px;--fs:16px}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;font-size:var(--fs);-webkit-tap-highlight-color:transparent;touch-action:manipulation}
body{padding-bottom:max(12px,env(safe-area-inset-bottom))}
.hidden{display:none!important}
#app{max-width:1100px;margin:0 auto;padding:12px}
header{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:12px}
header h1{font-size:18px;margin:0;flex:1;min-width:200px;font-weight:700}
.btn{border:1px solid var(--bd);background:var(--card);padding:10px 14px;border-radius:10px;cursor:pointer;font-size:15px;line-height:1.2}
.btn.primary{background:var(--pri);color:#fff;border-color:var(--pri)}
.btn.danger{background:var(--dn);color:#fff;border-color:var(--dn)}
.btn.ok{background:var(--ok);color:#fff;border-color:var(--ok)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.tab{padding:8px 12px;border-radius:999px;border:1px solid var(--bd);background:var(--card);cursor:pointer;font-size:14px}
.tab.on{background:#dbeafe;border-color:#93c5fd;color:#1e3a8a}
.card{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:12px;margin-bottom:12px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.grow{flex:1;min-width:120px}
label.small,.small{font-size:13px;color:var(--mut);display:block;margin-bottom:4px}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--bd);border-radius:10px;font-size:16px;background:#fff;-webkit-appearance:none;appearance:none}
textarea{min-height:110px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr;gap:10px}
@media(min-width:800px){.grid2{grid-template-columns:1fr 1fr}}
.tag{display:inline-flex;align-items:center;gap:4px;padding:2px 10px;border-radius:999px;background:#eef2ff;color:#3730a3;font-size:13px;margin:3px 3px 0 0}
.tag button{border:none;background:transparent;cursor:pointer;padding:0 2px;color:#6b21a8;font-size:16px;line-height:1}
.list{display:flex;flex-direction:column;gap:8px}
.item{border:1px solid var(--bd);border-radius:10px;padding:10px;background:#fafafa}
.item h3{margin:0 0 6px;font-size:16px;font-weight:600}
.muted{color:var(--mut);font-size:13px}
.charts{display:grid;grid-template-columns:1fr;gap:10px}
@media(min-width:800px){.charts{grid-template-columns:1fr 1fr}}
canvas{max-width:100%;height:220px!important}
.login{max-width:440px;margin:32px auto;padding:0 12px}
.login h2{text-align:center;font-size:20px;margin:0 0 8px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#111827;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;z-index:9999;opacity:.96;max-width:90vw;word-break:break-word}
#mask{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;z-index:9998}
#mask.hidden{pointer-events:none!important}
#mask .box{background:#fff;padding:18px;border-radius:12px;min-width:260px;max-width:90vw;text-align:center}
input[type=file].hidden{position:absolute;width:.1px;height:.1px;opacity:0;overflow:hidden}
.auth-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.auth-actions .btn.grow{flex:1;min-width:100px}
.btn.link{background:transparent;border:none;color:var(--pri);text-decoration:underline;padding:8px 4px;width:100%;margin-top:4px}
.lang-mini{text-align:center;margin-bottom:8px}
.lang-mini button{border:none;background:transparent;color:var(--pri);font-size:14px;padding:4px 8px}
</style>
</head>
<body>
<div id="toast" class="toast hidden"></div>
<div id="mask" class="hidden"><div class="box"><div id="maskText">…</div></div></div>

<div id="loginPage" class="login">
  <h2 data-i18n="t_login_title">微信AI内容归档系统</h2>
  <div class="lang-mini"><button type="button" id="langZh">中文</button><span class="muted"> · </span><button type="button" id="langEn">English</button></div>

  <div id="authLogin" class="card">
    <label class="grow"><span class="small" data-i18n="t_username">用户名</span><input id="lgUser" autocomplete="username" enterkeyhint="go"></label>
    <label class="grow" style="margin-top:10px;display:block"><span class="small" data-i18n="t_password">密码</span><input id="lgPass" type="password" autocomplete="current-password"></label>
    <div class="auth-actions">
      <button type="button" class="btn primary grow" id="btnLogin" data-i18n="t_login_only">登录</button>
      <button type="button" class="btn ok grow" id="btnGotoRegister" data-i18n="t_register_only">注册</button>
    </div>
    <button type="button" class="btn link" id="btnGotoReset" data-i18n="t_forgot_pwd">忘记密码</button>
    <p class="muted" style="margin:12px 0 0" data-i18n="t_login_hint">数据仅存本机浏览器；管理员登录后可在「设置」修改管理员页密码。</p>
  </div>

  <div id="authRegister" class="card hidden">
    <label class="grow"><span class="small" data-i18n="t_username">用户名</span><input id="rgUser" autocomplete="username"></label>
    <label class="grow" style="margin-top:10px;display:block"><span class="small" data-i18n="t_password">密码</span><input id="rgPass" type="password" autocomplete="new-password"></label>
    <label class="grow" style="margin-top:10px;display:block"><span class="small" data-i18n="t_password2">确认密码</span><input id="rgPass2" type="password" autocomplete="new-password"></label>
    <div class="auth-actions">
      <button type="button" class="btn primary grow" id="btnRegisterSubmit" data-i18n="t_register_submit">完成注册</button>
      <button type="button" class="btn grow" id="btnBackFromRegister" data-i18n="t_back_login">返回登录</button>
    </div>
  </div>

  <div id="authReset" class="card hidden">
    <label class="grow"><span class="small" data-i18n="t_username">用户名</span><input id="rsUser" autocomplete="username"></label>
    <label class="grow" style="margin-top:10px;display:block"><span class="small" data-i18n="t_new_password">新密码</span><input id="rsPass" type="password" autocomplete="new-password"></label>
    <label class="grow" style="margin-top:10px;display:block"><span class="small" data-i18n="t_password2">确认新密码</span><input id="rsPass2" type="password" autocomplete="new-password"></label>
    <p class="muted" style="margin:8px 0 0;font-size:13px" data-i18n="t_reset_warn">纯前端无法验证邮箱：任意知道用户名的人均可在本机重置（演示用）。</p>
    <div class="auth-actions">
      <button type="button" class="btn primary grow" id="btnResetSubmit" data-i18n="t_reset_submit">重置密码</button>
      <button type="button" class="btn grow" id="btnBackFromReset" data-i18n="t_back_login">返回登录</button>
    </div>
  </div>
</div>

<div id="app" class="hidden">
  <header>
    <h1 data-i18n="t_app_title">微信AI内容归档</h1>
    <select id="langSel" title="Language"><option value="zh">中文</option><option value="en">English</option></select>
    <button class="btn" id="btnLogout" data-i18n="t_logout">退出</button>
  </header>

  <div class="tabs" id="roleTabs">
    <div class="tab on" data-role="user" data-i18n="t_tab_user">个人数据</div>
    <div class="tab" data-role="admin" data-i18n="t_tab_admin">管理员（全部数据）</div>
  </div>

  <div id="userPanel">
    <div class="card">
      <div class="row" style="margin-bottom:8px">
        <strong data-i18n="t_settings">设置</strong>
        <button class="btn" id="btnSaveSettings" data-i18n="t_save">保存</button>
      </div>
      <div class="grid2">
        <label><span class="small">通义 / OpenAI 兼容 Base URL</span><input id="llmBaseUrl" type="url" placeholder="https://dashscope.aliyuncs.com/compatible-mode/v1" autocomplete="off"></label>
        <label><span class="small">API Key（通义 DashScope 等）</span><input id="llmKey" type="password" placeholder="sk-..." autocomplete="off"></label>
      </div>
      <label style="display:block;margin-top:10px"><span class="small">模型名（推荐 qwen-turbo / qwen-plus）</span><input id="llmModel" placeholder="qwen-turbo" autocomplete="off"></label>
      <p class="muted" style="margin:8px 0 0;font-size:13px">直连 API 可能因浏览器跨域失败，需中转或本机 http 访问。未配置时使用下方本地提炼算法。</p>
      <div class="grid2" style="margin-top:10px">
        <label><span class="small">Hugging Face Token（可选，备用）</span><input id="hfToken" type="password" placeholder="hf_..." autocomplete="off"></label>
        <label><span class="small" data-i18n="t_admin_pwd">管理员页密码（本机）</span><input id="adminPwd" type="password" autocomplete="new-password"></label>
      </div>
    </div>

    <div class="card">
      <strong data-i18n="t_input">内容输入</strong>
      <div class="row" style="margin-top:8px">
        <button class="btn" id="btnVoice" type="button" data-i18n="t_voice">语音识别</button>
        <label class="btn"><span data-i18n="t_img">图片OCR</span><input id="fileImg" class="hidden" type="file" accept="image/*"></label>
        <label class="btn"><span data-i18n="t_doc">文档上传</span><input id="fileDoc" class="hidden" type="file" accept=".txt,.md,.html,.docx,text/plain,application/vnd.openxmlformats-officedocument.wordprocessingml.document"></label>
      </div>
      <div class="row" style="margin-top:8px">
        <label class="grow"><span class="small" data-i18n="t_url">网页 / 视频号链接</span><input id="urlIn" type="url" inputmode="url" placeholder="https://..." autocomplete="off"></label>
        <button class="btn primary" type="button" id="btnParseUrl" data-i18n="t_parse">解析</button>
      </div>
      <label style="margin-top:10px;display:block"><span class="small" data-i18n="t_text">文字</span><textarea id="textIn" placeholder="粘贴或输入文字…" enterkeyhint="done"></textarea></label>
      <div class="row" style="margin-top:8px">
        <button class="btn primary" type="button" id="btnAiProcess" data-i18n="t_ai_run">AI：提取/总结/标签/待办/翻译</button>
        <button class="btn ok" type="button" id="btnArchive" data-i18n="t_archive">确认并归档</button>
      </div>
      <div id="aiPreview" class="muted" style="margin-top:8px;white-space:pre-wrap;word-break:break-word"></div>
      <div class="row" style="margin-top:8px;align-items:flex-start" id="tagEditor"></div>
      <div class="row" style="margin-top:8px">
        <input id="newTag" class="grow" placeholder="新标签 / New tag">
        <button class="btn" type="button" id="btnAddTag" data-i18n="t_add_tag">新增标签</button>
      </div>
    </div>

    <div class="card">
      <div class="row">
        <input id="q" class="grow" placeholder="搜索标题/内容/标签…">
        <select id="fTag" style="min-width:120px"><option value="" data-i18n="t_all_tags">全部标签</option></select>
        <select id="fType" style="min-width:110px">
          <option value="" data-i18n="t_all_types">全部类型</option>
          <option value="text">text</option>
          <option value="voice">voice</option>
          <option value="ocr">ocr</option>
          <option value="doc">doc</option>
          <option value="url">url</option>
          <option value="channels">channels</option>
        </select>
      </div>
      <div class="list" id="itemList" style="margin-top:10px"></div>
    </div>

    <div class="card">
      <strong data-i18n="t_todos">待办（自动）</strong>
      <div class="list" id="todoList" style="margin-top:8px"></div>
      <div class="row" style="margin-top:10px">
        <button class="btn" type="button" id="expMd" data-i18n="t_exp_md">导出 MD</button>
        <button class="btn" type="button" id="expDocx" data-i18n="t_exp_doc">导出 Word</button>
      </div>
    </div>

    <div class="card charts">
      <div><canvas id="cTime" aria-label="time chart"></canvas></div>
      <div><canvas id="cTags" aria-label="tags chart"></canvas></div>
    </div>
  </div>

  <div id="adminPanel" class="hidden">
    <div class="card">
      <div class="row">
        <input id="adminPass2" type="password" class="grow" data-i18n-placeholder="t_admin_unlock_ph" placeholder="输入管理员密码解锁">
        <button class="btn primary" type="button" id="btnAdminUnlock" data-i18n="t_unlock">解锁</button>
      </div>
    </div>
    <div id="adminBody" class="hidden">
      <div class="card">
        <strong data-i18n="t_admin_all">全部用户条目（只读汇总）</strong>
        <div class="row" style="margin-top:8px"><input id="aq" class="grow" placeholder="管理员搜索…"></div>
        <div class="list" id="adminList" style="margin-top:8px"></div>
      </div>
      <div class="card charts">
        <div><canvas id="cAdminTime"></canvas></div>
        <div><canvas id="cAdminUsers"></canvas></div>
      </div>
    </div>
  </div>
</div>

var LANG="zh";
function T(k){return (I18N[LANG]&&I18N[LANG][k])||k;}
function applyI18n(){
var list=document.querySelectorAll("[data-i18n]");
var i,el,k;
for(i=0;i<list.length;i++){
el=list[i];k=el.getAttribute("data-i18n");
if(k)el.textContent=T(k);
}
list=document.querySelectorAll("[data-i18n-placeholder]");
for(i=0;i<list.length;i++){
el=list[i];k=el.getAttribute("data-i18n-placeholder");
if(k)el.placeholder=T(k);
}
document.documentElement.lang=LANG==="zh"?"zh-CN":"en";
}

var PREFIX="wxai_arch_v2_";
var toastEl=document.getElementById("toast");
function toast(m){toastEl.textContent=m;toastEl.classList.remove("hidden");clearTimeout(toast._t);toast._t=setTimeout(function(){toastEl.classList.add("hidden");},2400);}
function mask(on,t){var m=document.getElementById("mask");document.getElementById("maskText").textContent=t||"…";m.classList.toggle("hidden",!on);}

function sha256HexFromBuf(buf){
var a=new Uint8Array(buf),out=[],i,x;
for(i=0;i<a.length;i++){
x=a[i].toString(16);
out.push(x.length<2?"0"+x:x);
}
return out.join("");
}
function sha256FromLib(str){
try{
var fn=window.sha256;
if(typeof fn==="function"){
var out=fn(str);
if(typeof out==="string"&&/^[0-9a-f]{64}$/i.test(out))return out;
}
}catch(e){}
return null;
}
function sha256Hex(str){
if(window.crypto&&window.crypto.subtle){
return window.crypto.subtle.digest("SHA-256",new TextEncoder().encode(str)).then(sha256HexFromBuf).catch(function(){
var x=sha256FromLib(str);
return x?x:Promise.reject(new Error("sha256"));
});
}
var x=sha256FromLib(str);
return x?Promise.resolve(x):Promise.reject(new Error("sha256"));
}

function storageKey(user,k){return PREFIX+user+":"+k;}
function readJSON(k,d){try{var s=localStorage.getItem(k);return s?JSON.parse(s):d;}catch(e){return d;}}
function writeJSON(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){toast("Storage full?");}}

function loadRegistry(){return readJSON(PREFIX+"__registry",{users:{}});}
function saveRegistry(reg){writeJSON(PREFIX+"__registry",reg);}

var BUILTIN_ACCOUNTS_VER=3;
function ensureBuiltInAccounts(){
return Promise.all([sha256Hex("Demo123456"),sha256Hex("Admin123456")]).then(function(arr){
var reg=loadRegistry();
if(!reg.users)reg.users={};
var ver=reg.builtinAccountsVer|0;
if(ver<BUILTIN_ACCOUNTS_VER||!reg.users.demo||!reg.users.admin){
reg.builtinAccountsVer=BUILTIN_ACCOUNTS_VER;
reg.users.demo={passHash:arr[0],created:(reg.users.demo&&reg.users.demo.created)||Date.now(),builtin:true};
reg.users.admin={passHash:arr[1],created:(reg.users.admin&&reg.users.admin.created)||Date.now(),builtin:true};
saveRegistry(reg);
}
var meta=loadMeta("admin");
if(!meta.adminPwdHash){
return sha256Hex("Admin123456").then(function(h){meta.adminPwdHash=h;saveMeta("admin",meta);});
}
});
}

function showAuthPanel(which){
document.getElementById("authLogin").classList.toggle("hidden",which!=="login");
document.getElementById("authRegister").classList.toggle("hidden",which!=="register");
document.getElementById("authReset").classList.toggle("hidden",which!=="reset");
}

function allUserNames(){
var reg=loadRegistry();
var names={};
Object.keys(reg.users||{}).forEach(function(u){if(u&&u!=="__registry")names[u]=1;});
for(var i=0;i<localStorage.length;i++){
var key=localStorage.key(i);
if(!key||key.indexOf(PREFIX)!==0)continue;
var rest=key.slice(PREFIX.length);
var u=rest.split(":")[0];
if(u&&u!=="__registry")names[u]=1;
}
return Object.keys(names);
}

function tokenizeZhWords(text){
var out=[],t=String(text);
if(typeof Intl!=="undefined"&&Intl.Segmenter){
try{
var seg=new Intl.Segmenter(LANG==="zh"?"zh-Hans":"en",{granularity:"word"});
var parts=Array.from(seg.segment(t)),ii,p;
for(ii=0;ii<parts.length;ii++){
p=parts[ii];
if(p&&p.segment&&p.isWordLike){
var w=String(p.segment).trim();
if(w.length>=2&&!STOP[w])out.push(w);
}
}
if(out.length)return out;
}catch(e){}
}
return zhFallbackPhrases(t);
}
function zhFallbackPhrases(t){
var ent=[],freq={},grams=[],i,j,ch,m,g;
t=String(t);
t.replace(/[\u4e00-\u9fa5]{2,16}(?:公司|集团|股份|有限公司|科技|汽车|电池|资产|运营)/g,function(x){ent.push(x);});
t.replace(/\d+(?:\.\d+)?[\u4e00-\u9fa5]{0,3}(?:亿|万|千万|百万|元)/g,function(x){ent.push(x);});
t.replace(/[\u4e00-\u9fa5]{2,4}(?:总|经理|先生|女士)/g,function(x){ent.push(x);});
ch=t.replace(/\s+/g,"");
for(i=0;i<ch.length;i++){
for(j=2;j<=4;j++){
if(i+j<=ch.length){
g=ch.slice(i,i+j);
if(/^[\u4e00-\u9fa5]+$/.test(g)&&!STOP[g])grams.push(g);
}
}
}
ent.forEach(function(x){freq[x]=(freq[x]||0)+8;});
grams.forEach(function(x){freq[x]=(freq[x]||0)+1;});
return Object.keys(freq).sort(function(a,b){return freq[b]-freq[a];}).slice(0,40);
}

function splitIntoSentences(text){
var s=String(text).trim();
if(!s)return [];
var raw=s.split(/[。！？!?]+/).map(function(x){return x.trim();}).filter(Boolean);
if(raw.length)return raw;
return s.split(/\n+/).map(function(x){return x.trim();}).filter(Boolean);
}
function scoreSentence(sent,idx,total){
var score=0,len=sent.length;
if(/\d/.test(sent))score+=3;
if(/公司|集团|有限|项目|产线|约定|沟通|合作|投资|基金|亿元|万元/.test(sent))score+=2;
score+=(total-idx)/Math.max(total,1)*2;
if(len>=15&&len<=100)score+=2;
if(len>160)score-=2;
return score;
}
function localSummaryBullets(text,maxChars){
maxChars=maxChars||520;
var sents=splitIntoSentences(text);
if(!sents.length){
var t=String(text).trim();
return t.length?("- "+t.slice(0,120)+(t.length>120?"…":"")):"";
}
var scored=sents.map(function(s,i){return {s:s,i:i,sc:scoreSentence(s,i,sents.length)};});
scored.sort(function(a,b){return b.sc-a.sc;});
var pick=[],used=0,i,x;
for(i=0;i<scored.length&&pick.length<7;i++){
x=scored[i].s;
if(x.length>110)x=x.slice(0,107)+"…";
if(used+x.length>maxChars&&pick.length>=3)break;
pick.push("- "+x);
used+=x.length+2;
}
return pick.join("\n");
}

function localTags(text,k){
k=k||10;
var freq={},toks=tokenizeZhWords(text),i,x;
for(i=0;i<toks.length;i++){
x=toks[i];
if(x.length>=2&&x.length<=16&&!STOP[x])freq[x]=(freq[x]||0)+3;
}
String(text).replace(/[\u4e00-\u9fa5]{2,16}(?:公司|集团|股份|有限公司|科技|汽车|电池|资产)/g,function(m){freq[m]=(freq[m]||0)+10;});
String(text).replace(/\d+(?:\.\d+)?[\u4e00-\u9fa5]{0,3}(?:亿|万|千万|百万|元)/g,function(m){freq[m]=(freq[m]||0)+6;});
var keys=Object.keys(freq).filter(function(a){return a.length>=2;}).sort(function(a,b){return freq[b]-freq[a];});
var out=[],seen={},j;
for(j=0;j<keys.length&&out.length<k;j++){
if(seen[keys[j]])continue;
seen[keys[j]]=1;
out.push(keys[j]);
}
return out;
}

function localTodos(text){
var lines=String(text).split(/\r?\n/);
var todos=[];
var re=/(\[[ xX]\]\s*.+|待办[:：]\s*.+|TODO[:：]\s*.+|【待办】\s*.+)/i;
for(var i=0;i<lines.length;i++){
if(re.test(lines[i]))todos.push(lines[i].trim());
}
var u={};
var out=[];
todos.forEach(function(t){if(!u[t]){u[t]=1;out.push(t);}});
return out.slice(0,50);
}

function hfChat(hfToken,prompt){

.then(function(res){return res.json().then(function(data){return {ok:res.ok,data:data};});})
.then(function(x){

function buildJsonPrompt(base,lang){

function mergeParsedJson(j,summary,tags,todos){
var s=summary,t=tags.slice(),td=todos.slice();
try{
if(!j)return {summary:s,tags:t,todos:td};
if(Array.isArray(j.summary_bullets)&&j.summary_bullets.length){
s=j.summary_bullets.map(String).map(function(x){return x.trim();}).filter(Boolean).slice(0,10).map(function(x){return x.indexOf("- ")===0?x:("- "+x);}).join("\n");
}
if(!s&&j.summary)s=String(j.summary);
if(Array.isArray(j.tags)&&j.tags.length){
t=j.tags.map(String).map(function(x){return x.trim();}).filter(function(x){return x.length>=2&&x.length<=32;}).filter(function(x,i,a){return a.indexOf(x)===i;}).slice(0,12);
}
if(Array.isArray(j.todos)&&j.todos.length){
var seen={},u=[];
j.todos.map(String).forEach(function(x){if(x&&!seen[x]){seen[x]=1;u.push(x);}});
td=u.slice(0,50);
}
}catch(e){}
return {summary:s,tags:t,todos:td};
}

function aiPipeline(rawText,meta,lang){
var base=String(rawText).trim();
var summary=localSummaryBullets(base,560);
var tags=localTags(base,10);
var todos=localTodos(base);
var zh="",en="";
var p1=mymemoryTranslate(base,lang==="zh"?"en":"zh");
return p1.then(function(tr){
if(lang==="zh")en=tr;else zh=tr;
function pack(note){return {extract:base,summary:summary,tags:tags,todos:todos,en:en,zh:zh,aiNote:note};}
function tryHF(nextNote){
if(!meta.hfToken)return Promise.resolve(pack(nextNote||(lang==="zh"?"（本地要点提炼）":"(Local bullets)")));
mask(true,lang==="zh"?"HF 模型…":"HF…");
var prompt=buildJsonPrompt(base,lang);
return hfChat(meta.hfToken,prompt).then(function(out){
mask(false);
try{
if(out){
var j=parseJsonFromModelText(out);
if(j){
var mg=mergeParsedJson(j,summary,tags,todos);
summary=mg.summary;tags=mg.tags;todos=mg.todos;
return pack(lang==="zh"?"（HF 模型）":"(HF)");
}
}
}catch(e){}
return pack(nextNote||(lang==="zh"?"（HF 无有效 JSON，保留本地结果）":""));
}).catch(function(){mask(false);return pack(nextNote);});
}
var hasLLM=meta.llmBaseUrl&&meta.llmKey&&String(meta.llmBaseUrl).trim()&&String(meta.llmKey).trim();
if(hasLLM){
mask(true,lang==="zh"?"通义/LLM…":"LLM…");
return llmChatComplete(meta,buildJsonPrompt(base,lang)).then(function(text){
mask(false);
if(text){
var j=parseJsonFromModelText(text);
if(j){
var mg=mergeParsedJson(j,summary,tags,todos);
summary=mg.summary;tags=mg.tags;todos=mg.todos;
return pack(lang==="zh"?"（通义/兼容 API）":"(LLM)");
}
}
return tryHF(lang==="zh"?"（API 无解析结果或跨域失败，尝试 HF）":"");
}).catch(function(){mask(false);return tryHF(lang==="zh"?"（LLM 请求失败，尝试 HF）":"");});
}
if(meta.hfToken)return tryHF();
return Promise.resolve(pack(lang==="zh"?"（本地要点提炼；可在设置配置通义）":"(Local; add LLM in Settings)"));
});
}

var u=document.getElementById("urlIn").value.trim();
if(LAST_INPUT_TYPE==="voice"||LAST_INPUT_TYPE==="ocr"||LAST_INPUT_TYPE==="doc")return LAST_INPUT_TYPE;
if(/channels\.weixin\.qq\.com|weixin\.qq\.com\/sph\//i.test(u))return "channels";
if(/^https?:\/\//i.test(u))return "url";
if(LAST_INPUT_TYPE)return LAST_INPUT_TYPE;
return "text";
}

bindClick("btnArchive",function(){
if(!CURRENT_USER)return;
var raw=document.getElementById("textIn").value.trim();
if(!raw){toast("empty");return;}
var meta=loadMeta(CURRENT_USER);
function saveEntry(){
var items=loadUserData(CURRENT_USER);
var entry={
id:String(Date.now())+Math.random().toString(16).slice(2),
created:Date.now(),
type:guessType(),
source:document.getElementById("urlIn").value.trim()||"manual",
text:raw,
summary:LAST_AI.summary,
tags:LAST_AI.tags.slice(),
todos:LAST_AI.todos.slice(),
en:LAST_AI.en,
zh:LAST_AI.zh
};
items.unshift(entry);
saveUserData(CURRENT_USER,items);
document.getElementById("textIn").value="";
document.getElementById("urlIn").value="";
LAST_AI=null;
LAST_INPUT_TYPE="text";
document.getElementById("aiPreview").textContent="";
document.getElementById("tagEditor").innerHTML="";
toast(LANG==="zh"?"已归档":"Archived");
renderAll();
}
if(!LAST_AI){
aiPipeline(raw,meta,LANG).then(function(res){LAST_AI=res;saveEntry();});
}else saveEntry();
});

function renderFilters(){
var items=loadUserData(CURRENT_USER);
var set={};
items.forEach(function(it){it.tags.forEach(function(t){set[t]=1;});});
var sel=document.getElementById("fTag");
var cur=sel.value;
sel.innerHTML="<option value=''>"+T("t_all_tags")+"</option>";
Object.keys(set).sort().forEach(function(t){
var o=document.createElement("option");o.value=t;o.textContent=t;sel.appendChild(o);
});
var ok=false;
for(var i=0;i<sel.options.length;i++)if(sel.options[i].value===cur){ok=true;break;}
sel.value=ok?cur:"";
}

function escapeHtml(s){
return String(s).replace(/[&<>"']/g,function(c){return({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]);});
}

function renderList(){
var q=document.getElementById("q").value.trim().toLowerCase();
var ft=document.getElementById("fTag").value;
var fty=document.getElementById("fType").value;
var items=loadUserData(CURRENT_USER).filter(function(it){
var blob=(it.text+" "+it.summary+" "+it.tags.join(" ")).toLowerCase();
if(q&&blob.indexOf(q)<0)return false;
if(ft&&it.tags.indexOf(ft)<0)return false;
if(fty&&it.type!==fty)return false;
return true;
});
var box=document.getElementById("itemList");
box.innerHTML="";
items.forEach(function(it){
var div=document.createElement("div");
div.className="item";
var tagHtml=it.tags.map(function(t){return "<span class=\"tag\">"+escapeHtml(t)+"</span>";}).join(" ");
div.innerHTML="<h3>"+escapeHtml((((it.summary||it.text).split("\n")[0])||it.text.slice(0,40)).slice(0,88))+"</h3>"+
"<div class=\"muted\">"+T("t_time")+": "+new Date(it.created).toLocaleString()+" · "+T("t_type")+": "+escapeHtml(it.type)+" · "+T("t_src")+": "+escapeHtml(it.source||"")+"</div>"+
"<div style=\"margin-top:6px\">"+tagHtml+"</div>"+
"<div style=\"margin-top:6px;white-space:pre-wrap;word-break:break-word\">"+escapeHtml(it.text.slice(0,400))+(it.text.length>400?"…":"")+"</div>"+
"<div class=\"row\" style=\"margin-top:8px\"><button type=\"button\" class=\"btn danger\" data-id=\""+escapeHtml(it.id)+"\">"+T("t_del")+"</button></div>";
box.appendChild(div);
});
var delBtns=box.querySelectorAll("button[data-id]");
for(var bi=0;bi<delBtns.length;bi++){
(function(btn){
btn.addEventListener("click",function(){
var id=btn.getAttribute("data-id");
var all=loadUserData(CURRENT_USER).filter(function(x){return x.id!==id;});
saveUserData(CURRENT_USER,all);
renderAll();
});
})(delBtns[bi]);
}
}

function renderTodos(){
var items=loadUserData(CURRENT_USER);
var map={};
items.forEach(function(it){
it.todos.forEach(function(t){map[t]=(map[t]||0)+1;});
});
var box=document.getElementById("todoList");
box.innerHTML="";
Object.keys(map).forEach(function(t){
var div=document.createElement("div");
div.className="item";
div.textContent=t+(map[t]>1?"  ("+map[t]+")":"");
box.appendChild(div);
});
}

function aggregateTodosMd(){
var items=loadUserData(CURRENT_USER);
var lines=["# Todos","","",""];
items.forEach(function(it){
if(it.todos.length){
lines.push("## "+new Date(it.created).toISOString());
it.todos.forEach(function(t){lines.push("- "+t);});
lines.push("");
}
});
return lines.join("\n");
}

bindClick("expMd",function(){
var blob=new Blob([aggregateTodosMd()],{type:"text/markdown;charset=utf-8"});
saveAs(blob,"todos.md");
});

bindClick("expDocx",function(){
var docxlib=window.docx;
if(!docxlib||typeof saveAs!=="function"){toast("docx/saveAs");return;}
var Document=docxlib.Document,Packer=docxlib.Packer,Paragraph=docxlib.Paragraph,TextRun=docxlib.TextRun;
var items=loadUserData(CURRENT_USER);
var paras=[new Paragraph({children:[new TextRun({text:"Todos",bold:true})]})];
items.forEach(function(it){
if(!it.todos.length)return;
paras.push(new Paragraph({children:[new TextRun({text:new Date(it.created).toLocaleString(),italics:true})]}));
it.todos.forEach(function(t){paras.push(new Paragraph({children:[new TextRun({text:"- "+t})]}));});
});
var doc=new Document({sections:[{children:paras}]});
Packer.toBlob(doc).then(function(ab){saveAs(ab,"todos.docx");}).catch(function(){toast("Word fail");});
});

function renderCharts(){
if(typeof Chart==="undefined")return;
var items=loadUserData(CURRENT_USER);
var byDay={};
var byTag={};
items.forEach(function(it){
var d=new Date(it.created).toLocaleDateString();
byDay[d]=(byDay[d]||0)+1;
it.tags.forEach(function(t){byTag[t]=(byTag[t]||0)+1;});
});
var labels=Object.keys(byDay).sort();
var data=labels.map(function(k){return byDay[k];});
destroyChart(charts.cTime);
charts.cTime=new Chart(document.getElementById("cTime"),{type:"line",data:{labels:labels,datasets:[{label:LANG==="zh"?"条目数":"Items",data:data,borderColor:"#2563eb",tension:.25}]},options:{plugins:{legend:{display:false}},responsive:true,maintainAspectRatio:false}});
var tlabels=Object.keys(byTag).sort(function(a,b){return byTag[b]-byTag[a];}).slice(0,10);
var tdata=tlabels.map(function(k){return byTag[k];});
destroyChart(charts.cTags);
charts.cTags=new Chart(document.getElementById("cTags"),{type:"doughnut",data:{labels:tlabels,datasets:[{data:tdata,backgroundColor:["#60a5fa","#34d399","#fbbf24","#f87171","#a78bfa","#fb7185","#2dd4bf","#fcd34d","#4ade80","#38bdf8"]}]},options:{plugins:{legend:{position:"bottom"}},responsive:true,maintainAspectRatio:false}});
}

function renderAll(){
if(!CURRENT_USER)return;
applyI18n();
renderFilters();
renderList();
renderTodos();
renderCharts();
}

(function(){var q=document.getElementById("q");if(q)q.addEventListener("input",function(){renderList();});})();
(function(){var ft=document.getElementById("fTag");if(ft)ft.addEventListener("change",function(){renderList();});})();
(function(){var fty=document.getElementById("fType");if(fty)fty.addEventListener("change",function(){renderList();});})();

(function(){
var tabs=document.querySelectorAll("#roleTabs .tab");
var i;
for(i=0;i<tabs.length;i++){
(function(tab){
tab.addEventListener("click",function(){
var k;
for(k=0;k<tabs.length;k++)tabs[k].classList.remove("on");
tab.classList.add("on");
var role=tab.getAttribute("data-role");
var userP=document.getElementById("userPanel");
var adminP=document.getElementById("adminPanel");
if(role==="user"){userP.classList.remove("hidden");adminP.classList.add("hidden");}
else{userP.classList.add("hidden");adminP.classList.remove("hidden");adminUnlocked=false;document.getElementById("adminBody").classList.add("hidden");}
});
})(tabs[i]);
}
})();

bindClick("btnAdminUnlock",function(){
var meta=loadMeta(CURRENT_USER);
var input=document.getElementById("adminPass2").value;
if(!meta.adminPwdHash){toast(LANG==="zh"?"请先在设置里设定管理员密码":"Set admin pwd in settings");return;}
sha256Hex(input).then(function(h){
if(h!==meta.adminPwdHash){toast(LANG==="zh"?"管理员密码错误":"Bad admin pwd");return;}
adminUnlocked=true;
document.getElementById("adminBody").classList.remove("hidden");
renderAdmin();
}).catch(function(){toast(LANG==="zh"?"无法校验管理员密码":"Admin verify failed");});
});

function allEntriesAllUsers(){
var out=[];
allUserNames().forEach(function(u){
loadUserData(u).forEach(function(it){out.push({user:u,id:it.id,created:it.created,type:it.type,source:it.source,text:it.text,summary:it.summary,tags:it.tags,todos:it.todos});});
});
return out.sort(function(a,b){return b.created-a.created;});
}

function renderAdmin(){
if(!adminUnlocked||typeof Chart==="undefined")return;
var q=document.getElementById("aq").value.trim().toLowerCase();
var list=allEntriesAllUsers().filter(function(it){
var blob=(it.user+" "+it.text+" "+it.summary+" "+it.tags.join(" ")).toLowerCase();
return !q||blob.indexOf(q)>=0;
});
var box=document.getElementById("adminList");
box.innerHTML="";
list.slice(0,400).forEach(function(it){
var div=document.createElement("div");
div.className="item";
div.innerHTML="<div class=\"muted\">"+escapeHtml(it.user)+" · "+new Date(it.created).toLocaleString()+" · "+escapeHtml(it.type)+"</div>"+
"<div style=\"margin-top:4px;font-weight:600\">"+escapeHtml(it.summary||it.text.slice(0,60))+"</div>"+
"<div class=\"muted\" style=\"margin-top:4px;word-break:break-word\">"+escapeHtml(it.text.slice(0,220))+"</div>";
box.appendChild(div);
});
var byDay={};
var byUser={};
list.forEach(function(it){
var d=new Date(it.created).toLocaleDateString();
byDay[d]=(byDay[d]||0)+1;
byUser[it.user]=(byUser[it.user]||0)+1;
});
var labels=Object.keys(byDay).sort();
var data=labels.map(function(k){return byDay[k];});
destroyChart(charts.cAdminTime);
charts.cAdminTime=new Chart(document.getElementById("cAdminTime"),{type:"bar",data:{labels:labels,datasets:[{label:"All",data:data,backgroundColor:"#6366f1"}]},options:{plugins:{legend:{display:false}},responsive:true,maintainAspectRatio:false}});
var ulabels=Object.keys(byUser);
var udata=ulabels.map(function(k){return byUser[k];});
destroyChart(charts.cAdminUsers);
charts.cAdminUsers=new Chart(document.getElementById("cAdminUsers"),{type:"pie",data:{labels:ulabels,datasets:[{data:udata,backgroundColor:["#22c55e","#3b82f6","#eab308","#f97316","#ec4899","#14b8a6","#a855f7","#ef4444","#0ea5e9","#84cc16"]}]},options:{plugins:{legend:{position:"bottom"}},responsive:true,maintainAspectRatio:false}});
}

(function(){var aq=document.getElementById("aq");if(aq)aq.addEventListener("input",function(){renderAdmin();});})();

ensureBuiltInAccounts().then(function(){applyI18n();}).catch(function(){applyI18n();});
})();
</script>
